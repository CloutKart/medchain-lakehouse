# Data quality checks, evaluated after every Gold build and written to
# gold.dq_scorecard as one row per (run, table, check).
#
# severity:
#   blocking - the run fails. Reserved for defects that would publish wrong numbers:
#              a duplicated dimension key, a fact whose foreign keys do not resolve.
#   warn     - recorded and surfaced, run continues. Most quality *metrics* belong
#              here. An MPI match rate drifting from 93% to 91% is worth seeing and
#              is not worth halting a nightly load over.
#
# comparison is how actual_value is tested against threshold: gte | lte | eq | gt | lt.
# For not_null / unique / range / referential / expression, actual_value is the
# *share of rows that pass*, so a threshold of 1.0 means "no exceptions permitted".

checks:

  # ---------------------------------------------------------------- dimensions

  - name: dim_patient.surrogate_key_unique
    layer: gold
    table: dim_patient
    type: unique
    columns: [patient_sk]
    threshold: 1.0
    comparison: gte
    severity: blocking      # a duplicated dim key silently doubles every joined fact

  - name: dim_patient.mpi_id_not_null
    layer: gold
    table: dim_patient
    type: not_null
    column: mpi_id
    threshold: 1.0
    comparison: gte
    severity: blocking

  - name: dim_patient.dob_plausible
    layer: gold
    table: dim_patient
    type: range
    column: age_years
    min: 0
    max: 120
    threshold: 0.999
    comparison: gte
    severity: warn

  - name: dim_doctor.surrogate_key_unique
    layer: gold
    table: dim_doctor
    type: unique
    columns: [doctor_sk]
    threshold: 1.0
    comparison: gte
    severity: blocking

  - name: dim_doctor.one_open_version_per_doctor
    layer: gold
    table: dim_doctor
    type: expression
    # Every doctor must have exactly one open SCD2 version. More than one means the
    # close-out step failed, and every point-in-time join downstream fans out.
    expression: "effective_from <= effective_to"
    threshold: 1.0
    comparison: gte
    severity: blocking

  - name: dim_hospital.row_count
    layer: gold
    table: dim_hospital
    type: row_count
    threshold: 8
    comparison: eq
    severity: blocking

  - name: dim_procedure.icd10_present
    layer: gold
    table: dim_procedure
    type: not_null
    column: icd10_code
    threshold: 0.99
    comparison: gte
    severity: warn

  - name: dim_date.date_key_unique
    layer: gold
    table: dim_date
    type: unique
    columns: [date_key]
    threshold: 1.0
    comparison: gte
    severity: blocking      # a duplicated calendar row doubles every dated fact

  # --------------------------------------------------------------------- facts

  - name: fact_patient_visit.visit_sk_unique
    layer: gold
    table: fact_patient_visit
    type: unique
    columns: [visit_sk]
    threshold: 1.0
    comparison: gte
    severity: blocking

  - name: fact_patient_visit.mpi_resolved
    layer: gold
    table: fact_patient_visit
    type: not_null
    column: mpi_id
    threshold: 0.999
    comparison: gte
    severity: blocking      # an unresolved patient breaks the whole journey story

  - name: fact_patient_visit.patient_fk_resolves
    layer: gold
    table: fact_patient_visit
    type: referential
    column: patient_sk
    ref_table: dim_patient
    ref_column: patient_sk
    threshold: 1.0
    comparison: gte
    severity: blocking

  - name: fact_patient_visit.doctor_fk_resolves
    layer: gold
    table: fact_patient_visit
    type: referential
    column: doctor_sk
    ref_table: dim_doctor
    ref_column: doctor_sk
    threshold: 1.0
    comparison: gte
    severity: blocking

  - name: fact_patient_visit.hospital_fk_resolves
    layer: gold
    table: fact_patient_visit
    type: referential
    column: hospital_sk
    ref_table: dim_hospital
    ref_column: hospital_sk
    threshold: 1.0
    comparison: gte
    severity: blocking

  - name: fact_patient_visit.department_attributed
    layer: gold
    table: fact_patient_visit
    type: not_null
    column: department_at_visit
    threshold: 0.99
    comparison: gte
    severity: warn

  - name: fact_patient_visit.discharge_after_admission
    layer: gold
    table: fact_patient_visit
    type: expression
    expression: "discharge_date >= admission_date"
    threshold: 1.0
    comparison: gte
    severity: blocking

  - name: fact_patient_visit.length_of_stay_plausible
    layer: gold
    table: fact_patient_visit
    type: range
    column: length_of_stay
    min: 0
    max: 180
    threshold: 1.0
    comparison: gte
    severity: warn

  - name: fact_claim_lifecycle.transition_unique
    layer: gold
    table: fact_claim_lifecycle
    type: unique
    columns: [transition_key]
    threshold: 1.0
    comparison: gte
    severity: blocking      # the audit trail must not double-count a transition

  - name: fact_claim_lifecycle.no_illegal_transitions
    layer: gold
    table: fact_claim_lifecycle
    type: expression
    # GAP is expected (weekly exports miss intermediate states). ILLEGAL is not:
    # it means the target state is unreachable from the previous one.
    expression: "transition_class <> 'ILLEGAL'"
    threshold: 0.999
    comparison: gte
    severity: warn

  - name: fact_claim_lifecycle.insurer_fk_resolves
    layer: gold
    table: fact_claim_lifecycle
    type: referential
    column: insurer_sk
    ref_table: dim_insurer
    ref_column: insurer_sk
    threshold: 1.0
    comparison: gte
    severity: blocking

  - name: fact_billing_reconciliation.claim_bill_unique
    layer: gold
    table: fact_billing_reconciliation
    type: unique
    columns: [claim_id, bill_id]
    threshold: 1.0
    comparison: gte
    severity: blocking

  - name: fact_billing_reconciliation.deductions_never_negative
    layer: gold
    table: fact_billing_reconciliation
    type: expression
    expression: >
      excluded_amount >= 0 AND room_rent_excess >= 0 AND copay_amount >= 0
      AND other_deduction >= 0 AND net_reimbursement >= 0
    threshold: 1.0
    comparison: gte
    severity: blocking

  - name: fact_billing_reconciliation.reimbursement_within_billed
    layer: gold
    table: fact_billing_reconciliation
    type: expression
    # An insurer never reimburses more than was billed. If this fails, the
    # deduction cascade has an ordering bug.
    expression: "net_reimbursement <= billed_amount + 1"
    threshold: 1.0
    comparison: gte
    severity: blocking

  - name: fact_billing_reconciliation.linked_to_a_bill
    layer: gold
    table: fact_billing_reconciliation
    type: expression
    expression: "is_linked"
    threshold: 0.95
    comparison: gte
    severity: warn

  - name: fact_bed_occupancy.ward_day_unique
    layer: gold
    table: fact_bed_occupancy
    type: unique
    columns: [ward_id, occupancy_date]
    threshold: 1.0
    comparison: gte
    severity: blocking      # the stated grain is one row per ward per day

  - name: fact_bed_occupancy.occupancy_rate_plausible
    layer: gold
    table: fact_bed_occupancy
    type: range
    column: occupancy_rate
    min: 0
    max: 1.5
    threshold: 0.999
    comparison: gte
    severity: warn

  - name: fact_bed_occupancy.occupied_within_capacity
    layer: gold
    table: fact_bed_occupancy
    type: expression
    # Over-capacity days are real (corridor beds during a surge) but should be rare.
    expression: "occupied_beds <= bed_count * 1.5"
    threshold: 0.999
    comparison: gte
    severity: warn
