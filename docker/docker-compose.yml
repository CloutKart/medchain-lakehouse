# Convenience wrapper around Dockerfile.dev.
#
#   docker compose -f docker/docker-compose.yml run --rm dev make run-local
#   docker compose -f docker/docker-compose.yml up dashboard

services:
  dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    volumes:
      # Bind-mount the repo so edits are live, but keep data/ and the Ivy cache in
      # named volumes — 600 MB of generated Delta files through a bind mount is slow.
      - ..:/work
      - medchain-data:/work/data
      - ivy-cache:/root/.ivy2
    environment:
      MEDCHAIN_ENV: local
    working_dir: /work

  dashboard:
    extends: dev
    # Exports Gold to JSON, then serves the built dashboard. The export is Python;
    # the frontend build needs Node, which the dev image does not carry — so this
    # serves a build produced by `make web-build` on the host.
    command: >
      sh -c "uv run medchain-web-export &&
             python3 -m http.server 4173 --directory dashboards/web/dist"
    ports:
      - "4173:4173"

volumes:
  medchain-data:
  ivy-cache:
