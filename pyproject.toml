[project]
name = "medchain"
version = "0.1.0"
description = "MedChain Analytics — hospital claims & patient journey lakehouse (Bronze/Silver/Gold on Delta Lake)"
requires-python = "==3.11.*"
# Deliberately empty.
#
# This wheel is installed as a library on a Databricks cluster, and every package it
# would otherwise declare — pyspark, delta-spark, pandas, numpy, pyyaml — is already
# provided by the runtime. Declaring them makes pip *upgrade* the runtime's copies:
# numpy went from 1.x to 2.4.6, Databricks' own compiled modules could not import
# against it, and the cluster failed with "Failure starting repl" before a single
# line of pipeline code ran.
#
# So the runtime's packages live in the `local` extra, which local development, CI
# and Docker install and the cluster does not.
dependencies = []

[project.optional-dependencies]
# Everything Databricks Runtime 15.4 LTS already provides. Pinned to match it, so
# local behaviour and cluster behaviour agree.
local = [
    "pyspark==3.5.0",
    "delta-spark==3.2.0",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "python-dateutil>=2.9",
]
generate = [
    "faker>=30.0",
    "numpy>=1.26",
]
dashboard = [
    "streamlit>=1.40",
    "deltalake>=0.20",
    "duckdb>=1.1",
    "plotly>=5.24",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML",
]

[project.scripts]
medchain-gen = "medchain.generate.cli:main"
medchain-run = "medchain.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medchain"]

# Ship conf/ inside the wheel as medchain/conf. The package reads its source
# contracts, quality checks and seed reference data at runtime, so a wheel without
# them installs cleanly and then fails on the first call — on a Databricks cluster,
# several minutes into a pipeline run. config._resolve_conf_dir finds this copy.
[tool.hatch.build.targets.wheel.force-include]
"conf" = "medchain/conf"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = [
    # `from pyspark.sql import functions as F` is the universal PySpark convention.
    # Renaming it to lowercase would make every expression in this codebase read
    # differently from every PySpark example anyone has seen.
    "N812",
    # zip() without strict=. Most call sites here zip arrays whose equal length is
    # guaranteed by construction a few lines above; adding strict= everywhere adds
    # noise without catching a real defect.
    "B905",
    # Spark and pandas idioms use non-lowercase names in places.
    "N803",
    "N806",
]

[tool.mypy]
python_version = "3.11"
packages = ["medchain"]
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "spark: requires a local SparkSession (slow)",
    "integration: full bronze->silver->gold run (slowest)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
